<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C Programming | Tracing Practice</title><style>:root{font-family:Inter,system-ui,Arial,sans-serif;background:#f4f7fc;color:#17223b}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#142c59,#375dc9);padding:32px max(20px,calc((100vw - 1120px)/2));color:white}h1{margin:7px 0}.wrap{max-width:1120px;margin:25px auto;padding:0 18px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}button,.link{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font-weight:750;background:#e5ebfa;color:#25437f;text-decoration:none}button.active,button.primary{background:#3157c7;color:white}.link{display:inline-block;background:white;margin-top:12px}.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:20px}.card{background:white;border:1px solid #dfe5f1;border-radius:16px;padding:22px;min-width:0}.badge{background:#e8eeff;color:#24489e;padding:6px 10px;border-radius:30px;font-size:12px;font-weight:800}pre{background:#101d35;color:#e6efff;border-radius:12px;padding:12px 0;overflow:auto;line-height:1.65;font-size:13px}pre .line{display:block;padding:0 14px;white-space:pre}.line.now{background:#3157c7;color:white}.line .num{display:inline-block;color:#8ea0bf;width:27px;user-select:none}.line.now .num{color:#c9dcff}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.status{background:#eef4ff;padding:15px;border-radius:10px;min-height:75px;line-height:1.5}.kv{display:flex;gap:12px;flex-wrap:wrap}.kv span{background:#eef4ff;padding:8px 13px;border-radius:8px}.terminal{background:#101d35;color:#9bf3c6;min-height:95px;padding:15px;border-radius:10px;white-space:pre-line;font-family:monospace}.scroll{max-height:245px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #e0e6f0;text-align:left;padding:9px}input[type=text]{width:100%;padding:12px;border:1px solid #aebcda;border-radius:9px}label{display:block;font-weight:700;margin-bottom:8px}.feedback{min-height:25px;font-weight:700;margin-top:10px}p{line-height:1.6}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><span class="badge">INTERACTIVE • C PROGRAMMING</span><h1>Code Tracing</h1><p>Follow code execution and see how variables and output change.</p><a class="link" href="syntax.html">← Back to Syntax Learning</a></header><main class="wrap"><nav class="tabs" id="tabs"></nav><div class="grid"><section class="card"><h2 id="heading"></h2><p id="intro"></p><h3>Source code</h3><pre id="code"></pre><div class="controls"><button class="primary" id="next">Next →</button><button id="back">← Previous</button><button id="all">Run to end</button><button id="reset">Reset</button></div><div class="status" id="status" aria-live="polite"></div></section><section class="card"><h2>Variable and output</h2><h3>Current variable</h3><div class="kv"><span id="variable"></span></div><h3>Output so far</h3><div class="terminal" id="terminal"></div><h3>Execution details</h3><div class="scroll"><table><thead><tr><th>Line</th><th>Variable value</th><th>Action</th></tr></thead><tbody id="history"></tbody></table></div></section></div></main><script>
const data=[{"name": "if", "heading": "Trace an if statement", "intro": "A condition decides whether the printf statement runs.", "varName": "num", "code": "#include <stdio.h>\nint main() {\n    int num = 10;\n    if (num > 0) {\n        printf(\"Number is positive\\n\");\n    }\n    return 0;\n}", "steps": [[3, 10, "Initialize num = 10"], [4, 10, "Check num > 0: true"], [5, 10, "Print Number is positive", "Number is positive"], [7, 10, "return 0; program finishes"]]},{"name": "if...else", "heading": "Trace an if...else statement", "intro": "Exactly one branch runs.", "varName": "num", "code": "#include <stdio.h>\nint main() {\n    int num = -5;\n    if (num > 0) {\n        printf(\"Number is positive\\n\");\n    } else {\n        printf(\"Number is not positive\\n\");\n    }\n    return 0;\n}", "steps": [[3, -5, "Initialize num = -5"], [4, -5, "Check num > 0: false"], [6, -5, "Enter else branch"], [7, -5, "Print Number is not positive", "Number is not positive"], [9, -5, "return 0; program finishes"]]},{"name": "if...else if...else", "heading": "Trace an else-if chain", "intro": "Conditions are checked in order; the first true branch runs.", "varName": "marks", "code": "#include <stdio.h>\nint main() {\n    int marks = 75;\n    if (marks >= 90) {\n        printf(\"Grade A\\n\");\n    } else if (marks >= 75) {\n        printf(\"Grade B\\n\");\n    } else if (marks >= 50) {\n        printf(\"Grade C\\n\");\n    } else {\n        printf(\"Fail\\n\");\n    }\n    return 0;\n}", "steps": [[3, 75, "Initialize marks = 75"], [4, 75, "Check marks >= 90: false"], [6, 75, "Check marks >= 75: true"], [7, 75, "Print Grade B", "Grade B"], [13, 75, "return 0; program finishes"]]},{name:'switch',heading:'Trace a switch statement',intro:'The program selects the matching case for day = 3.',code:'#include <stdio.h>\nint main() {\n    int day = 3;\n    switch (day) {\n        case 1:\n            printf("Monday\\n");\n            break;\n        case 2:\n            printf("Tuesday\\n");\n            break;\n        case 3:\n            printf("Wednesday\\n");\n            break;\n        default:\n            printf("Another day\\n");\n    }\n    return 0;\n}',steps:[[3,3,'Assign day = 3'],[4,3,'Evaluate switch(day)'],[5,3,'case 1 does not match'],[8,3,'case 2 does not match'],[11,3,'case 3 matches'],[12,3,'Print Wednesday','Wednesday'],[13,3,'break exits the switch'],[18,3,'return 0; program finishes']]},
{name:'while',heading:'Trace a while loop',intro:'The condition is tested before each iteration.',code:'#include <stdio.h>\nint main() {\n    int i = 1;\n    while (i <= 5) {\n        printf("i = %d\\n", i);\n        i++;\n    }\n    return 0;\n}',steps:loop('while')},
{name:'do...while',heading:'Trace a do...while loop',intro:'The body executes before the condition is tested.',code:'#include <stdio.h>\nint main() {\n    int i = 1;\n    do {\n        printf("i = %d\\n", i);\n        i++;\n    } while (i <= 5);\n    return 0;\n}',steps:loop('do')},
{name:'for',heading:'Trace a for loop',intro:'Initialization happens once, followed by condition, body, and update.',code:'#include <stdio.h>\nint main() {\n    for (int i = 1; i <= 5; i++) {\n        printf("i = %d\\n", i);\n    }\n    return 0;\n}',steps:loop('for')},
{name:'while(1)',heading:'Trace an infinite loop with break',intro:'The condition is always true, but break stops execution.',code:'#include <stdio.h>\nint main() {\n    int i = 1;\n    while (1) { // infinite loop\n        printf("i = %d\\n", i);\n        i++;\n        if (i > 5) {\n            break; // exit the loop\n        }\n    }\n    return 0;\n}',steps:loop('infinite')}];
function loop(type){let s=[];if(type!=='for')s.push([3,1,'Initialize i = 1']);else s.push([3,1,'Initialize i = 1 (once)']);for(let i=1;i<=5;i++){if(type==='while')s.push([4,i,`Check ${i} <= 5: true`]);if(type==='for')s.push([3,i,`Check ${i} <= 5: true`]);if(type==='infinite')s.push([4,i,'Check while(1): true']);s.push([type==='for'?4:5,i,`Print i = ${i}`,`i = ${i}`]);s.push([type==='for'?3:6,i+1,`Increment i to ${i+1}`]);if(type==='do')s.push([7,i+1,`Check ${i+1} <= 5: ${i+1<=5}`]);if(type==='infinite')s.push([7,i+1,`Check ${i+1} > 5: ${i+1>5}`]);}if(type==='while')s.push([4,6,'Check 6 <= 5: false; exit loop']);if(type==='for')s.push([3,6,'Check 6 <= 5: false; exit loop']);if(type==='infinite')s.push([8,6,'break exits the loop']);s.push([type==='infinite'?11:8,6,'return 0; program finishes']);return s}
let current=0,index=0;const el=id=>document.getElementById(id);function show(i){current=i;index=0;let d=data[i];el('tabs').innerHTML=data.map((x,j)=>`<button data-index="${j}" class="${i===j?'active':''}">${x.name}</button>`).join('');el('heading').textContent=d.heading;el('intro').textContent=d.intro;render()}function render(){let d=data[current],step=d.steps[index-1],lines=d.code.split('\n');el('code').innerHTML=lines.map((l,i)=>`<span class="line ${step&&step[0]===i+1?'now':''}"><span class="num">${i+1}</span>${escapeHtml(l)}</span>`).join('');el('status').textContent=step?step[2]:'Ready. Click “Next” to follow execution.';el('variable').textContent=step?`${d.varName || (d.name === 'switch' ? 'day' : 'i')} = ${step[1]}`:'Not initialized';let done=d.steps.slice(0,index),output=done.filter(s=>s[3]).map(s=>s[3]);el('terminal').textContent=output.join('\n')||'(no output yet)';el('history').innerHTML=done.map((s,i)=>`<tr><td>${s[0]}</td><td>${s[1]}</td><td>${escapeHtml(s[2])}</td></tr>`).join('');el('next').disabled=index===d.steps.length;el('back').disabled=index===0}function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}el('tabs').onclick=e=>{let b=e.target.closest('button[data-index]');if(b)show(+b.dataset.index)};el('next').onclick=()=>{index=Math.min(index+1,data[current].steps.length);render()};el('back').onclick=()=>{index=Math.max(index-1,0);render()};el('all').onclick=()=>{index=data[current].steps.length;render()};el('reset').onclick=()=>{index=0;render();};show(0);
</script></body></html>
