<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C Programming | Syntax Lab</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#17223b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#142c59,#345ac5);color:white;padding:36px max(22px,calc((100vw - 1100px)/2))}header h1{margin:6px 0;font-size:clamp(28px,4vw,42px)}header p{opacity:.9}main{max-width:1100px;margin:26px auto;padding:0 18px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}button,a.button{cursor:pointer;border:0;border-radius:11px;padding:12px 17px;font-weight:700;background:#e5eafa;color:#233e78;text-decoration:none}button.active,button.primary{background:#3157c7;color:white}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:white;border:1px solid #dfe5f1;border-radius:17px;padding:24px;box-shadow:0 5px 18px #1c39700c}.panel h2{margin-top:0}.tag{display:inline-block;background:#eaf0ff;color:#2b4da6;border-radius:30px;padding:5px 11px;font-size:12px;font-weight:800}pre{background:#101d35;color:#e4edff;padding:20px;border-radius:13px;overflow:auto;line-height:1.65;font-size:14px;white-space:pre-wrap}code{font-family:Consolas,Monaco,monospace}.kw{color:#89b8ff}.fn{color:#7ce0d0}.str{color:#f7c77c}.cm{color:#94a3b8}.explain{padding-left:20px;line-height:1.9}.note{background:#fff7df;border-left:4px solid #f2bd40;padding:13px;border-radius:8px;margin-top:15px}.output{background:#e9f8f2;padding:15px;border-radius:10px;white-space:pre-line;font-family:monospace;min-height:55px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}input[type=number]{width:95px;padding:10px;border:1px solid #aebcda;border-radius:9px;font-size:16px}footer{margin:35px auto;text-align:center;color:#64748b}@media(max-width:780px){.layout{grid-template-columns:1fr}header{padding:30px 22px}}
</style></head><body><header><span class="tag">C CONDITIONAL & LOOP STATEMENTS</span><h1>C Syntax Guide</h1><p>Understand C conditional and loop statements through syntax, examples, and output.</p><a class="button" href="tracing.html">Open Tracing Practice →</a></header><main><nav class="tabs" id="tabs" aria-label="Select C topic"></nav><div class="layout"><section class="panel"><span class="tag" id="category"></span><h2 id="title"></h2><p id="definition"></p><h3>General syntax</h3><pre><code id="syntax"></code></pre><h3>C example</h3><pre><code id="example"></code></pre></section><section class="panel"><h2>How it works</h2><ol class="explain" id="steps"></ol><div class="note" id="tip"></div><h3>Change the value</h3><p id="prompt"></p><div class="controls"><label for="value">Value:</label><input id="value" type="number" value="3"><button class="primary" id="run">Show output</button></div><h3>Program output</h3><div class="output" id="output" aria-live="polite"></div></section></div></main><footer>C Conditional and Loop Statements</footer><script>
const topics=[
{"id":"if","name":"if","category":"Conditional statement","definition":"Executes a block only when its condition is true.","syntax":"if (condition) {\n    // code if condition is true\n}","example":"#include <stdio.h>\n\nint main() {\n    int num = 10;\n    if (num > 0) {\n        printf(\"Number is positive\\n\");\n    }\n    return 0;\n}","steps":["Set num to 10.", "Check whether num > 0.", "If true, print Number is positive.", "If false, skip the body."],"tip":"A plain if statement has no alternative branch.","prompt":"Try a positive, zero, or negative value for num.","initial":10,"run":n=>({text:n > 0 ? "Number is positive" : "(no output)"})},
{"id":"ifelse","name":"if...else","category":"Conditional statement","definition":"Executes one block if the condition is true and another if it is false.","syntax":"if (condition) {\n    // code if true\n} else {\n    // code if false\n}","example":"#include <stdio.h>\n\nint main() {\n    int num = -5;\n    if (num > 0) {\n        printf(\"Number is positive\\n\");\n    } else {\n        printf(\"Number is not positive\\n\");\n    }\n    return 0;\n}","steps":["Set num to -5.", "Evaluate num > 0.", "Run the if block if true.", "Otherwise run the else block."],"tip":"Zero is not positive, so it follows the else branch.","prompt":"Try -5, 0, or 10 for num.","initial":-5,"run":n=>({text:n > 0 ? "Number is positive" : "Number is not positive"})},
{"id":"elseif","name":"if...else if...else","category":"Conditional statement","definition":"Checks conditions in order and executes only the first matching branch, or else if none match.","syntax":"if (condition1) {\n    // first branch\n} else if (condition2) {\n    // second branch\n} else {\n    // fallback branch\n}","example":"#include <stdio.h>\n\nint main() {\n    int marks = 75;\n    if (marks >= 90) {\n        printf(\"Grade A\\n\");\n    } else if (marks >= 75) {\n        printf(\"Grade B\\n\");\n    } else if (marks >= 50) {\n        printf(\"Grade C\\n\");\n    } else {\n        printf(\"Fail\\n\");\n    }\n    return 0;\n}","steps":["Set marks to 75.", "Check marks >= 90: false.", "Check marks >= 75: true.", "Print Grade B and skip the remaining branches."],"tip":"The order of conditions matters. Put the highest grade threshold first.","prompt":"Try marks of 95, 75, 60, or 30.","initial":75,"run":n=>({text:n >= 90 ? "Grade A" : n >= 75 ? "Grade B" : n >= 50 ? "Grade C" : "Fail"})},

{id:'switch',name:'switch',category:'Conditional statement',definition:'Selects one block of code from multiple options based on the value of an expression.',syntax:'switch (expression) {\n    case value1:\n        // code for value1\n        break;\n    case value2:\n        // code for value2\n        break;\n    default:\n        // code if no case matches\n}',example:'#include <stdio.h>\n\nint main() {\n    int day = 3;\n    switch (day) {\n        case 1:\n            printf("Monday\\n");\n            break;\n        case 2:\n            printf("Tuesday\\n");\n            break;\n        case 3:\n            printf("Wednesday\\n");\n            break;\n        default:\n            printf("Another day\\n");\n    }\n    return 0;\n}',steps:['Evaluate the expression inside switch (day).','Find the matching case label.','Execute its printf statement.','break exits the switch; default runs if no case matches.'],tip:'A break prevents execution from continuing into the following case (fall-through).',prompt:'Change day (try 1, 2, 3, or 7).',initial:3,run:n=>({text:({1:'Monday',2:'Tuesday',3:'Wednesday'}[n]||'Another day')})},
{id:'while',name:'while',category:'Repeated statement',definition:'Repeats a block of code as long as its condition is true. The condition is tested before the first iteration.',syntax:'while (condition) {\n    // code to execute repeatedly\n}',example:'#include <stdio.h>\n\nint main() {\n    int i = 1;\n    while (i <= 5) {\n        printf("i = %d\\n", i);\n        i++;\n    }\n    return 0;\n}',steps:['Initialize i to 1.','Check i <= 5 before entering the loop.','Print i, then increment i using i++.','Repeat until the condition becomes false.'],tip:'A while loop may execute zero times when the initial condition is false.',prompt:'Change the starting value of i (try 1 or 6).',initial:1,run:n=>({text:Array.from({length:Math.max(0,Math.min(100,6-n))},(_,k)=>`i = ${n+k}`).join('\n')||'(no output)'})},
{id:'do',name:'do...while',category:'Repeated statement',definition:'Executes the block at least once, then repeats while the condition remains true.',syntax:'do {\n    // code to execute\n} while (condition);',example:'#include <stdio.h>\n\nint main() {\n    int i = 1;\n    do {\n        printf("i = %d\\n", i);\n        i++;\n    } while (i <= 5);\n    return 0;\n}',steps:['Initialize i to 1.','Run the body first, without checking the condition.','Print i and increment it.','Check i <= 5; repeat if true.'],tip:'Unlike while, do...while always runs its body at least once. Notice the semicolon after while(condition);',prompt:'Change the starting value of i (try 1 or 6).',initial:1,run:n=>({text:Array.from({length:Math.max(1,Math.min(100,6-n))},(_,k)=>`i = ${n+k}`).join('\n')})},
{id:'for',name:'for',category:'Repeated statement',definition:'Combines initialization, a condition, and an update in a single loop header.',syntax:'for (initialization; condition; increment) {\n    // code to execute\n}',example:'#include <stdio.h>\n\nint main() {\n    for (int i = 1; i <= 5; i++) {\n        printf("i = %d\\n", i);\n    }\n    return 0;\n}',steps:['Initialize i to 1, once.','Test i <= 5 before each iteration.','Print the current value of i.','Apply i++ after the body, then test again.'],tip:'A for loop is especially useful when the number of iterations is known.',prompt:'Experiment with the initialization value of i (the original example uses 1).',initial:1,run:n=>({text:Array.from({length:Math.max(0,Math.min(100,6-n))},(_,k)=>`i = ${n+k}`).join('\n')||'(no output)'})},
{id:'infinite',name:'while(1) + break',category:'Infinite loop with an exit',definition:'while(1) has an always-true condition, so it continues until an exit such as break is reached.',syntax:'while (1) {\n    // repeated statements\n    if (exit_condition) {\n        break;\n    }\n}',example:'#include <stdio.h>\n\nint main() {\n    int i = 1;\n    while (1) { // infinite loop\n        printf("i = %d\\n", i);\n        i++;\n        if (i > 5) {\n            break; // exit the loop\n        }\n    }\n    return 0;\n}',steps:['Initialize i to 1.','Enter while(1), which always evaluates as true.','Print i, then increment i.','If the new value of i is greater than 5, break exits the loop.'],tip:'The slide’s example is not truly endless in practice: break stops it after printing 1 through 5.',prompt:'Change the starting value of i; break is checked after printing and incrementing.',initial:1,run:n=>({text:Array.from({length:Math.max(1,Math.min(100,6-n))},(_,k)=>`i = ${n+k}`).join('\n')})}
];let current=0;const el=id=>document.getElementById(id);function highlight(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/("(?:[^"\\]|\\.)*")|(\/\/[^\n]*)|\b(switch|case|break|default|while|do|for|if|else|return|int)\b|\b(printf|main)\b/g,(m,str,comment,kw,fn)=>`<span class="${str?'str':comment?'cm':kw?'kw':'fn'}">${m}</span>`)}function show(i){current=i;let t=topics[i];el('tabs').innerHTML=topics.map((x,j)=>`<button class="${i===j?'active':''}" data-i="${j}">${x.name}</button>`).join('');el('category').textContent=t.category;el('title').textContent=t.name;el('definition').textContent=t.definition;el('syntax').innerHTML=highlight(t.syntax);el('example').innerHTML=highlight(t.example);el('steps').innerHTML=t.steps.map(s=>`<li>${s}</li>`).join('');el('tip').textContent=t.tip;el('prompt').textContent=t.prompt;el('value').value=t.initial;run();}function run(){let n=Number(el('value').value);if(!Number.isSafeInteger(n)||Math.abs(n)>100000){el('output').textContent='Please enter a whole number between -100000 and 100000.';return}let t=topics[current],r=t.run(n);el('output').textContent=r.text+(t.id!=='switch'&&n< -94?'\n(Preview limited to 100 iterations)':'')}el('tabs').addEventListener('click',e=>{let b=e.target.closest('button[data-i]');if(b)show(Number(b.dataset.i))});el('run').onclick=run;el('value').addEventListener('keydown',e=>{if(e.key==='Enter')run()});show(0);
</script></body></html>
